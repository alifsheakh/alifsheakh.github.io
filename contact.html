<script>
const L=[["Email",PROFILE.email,"mailto:"+PROFILE.email],["Google Scholar","Citations",PROFILE.scholar],["ORCID","0009-0006-5845-5210",PROFILE.orcid],["IEEE Xplore","Author profile",PROFILE.ieee],["ResearchGate","Md-Alif-Sheakh",PROFILE.researchgate],["LinkedIn","in/alifsheakh",PROFILE.linkedin],["GitHub","alifsheakh",PROFILE.github]];

reveal();
